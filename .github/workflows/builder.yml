# ╔═══════════════════════════════════════════════════════════╗
# ║             Portfolio — Build & Deploy                    ║
# ║  Déploie automatiquement sur la branche 'develop'        ║
# ╚═══════════════════════════════════════════════════════════╝

name: Build & Deploy Portfolio

on:
  push:
    branches:
      - main        # Déclenche le build sur push vers main
  pull_request:
    branches:
      - main        # Vérifie le build sur les PRs

# Permissions pour pousser sur develop
permissions:
  contents: write

jobs:
  # ─── Job 1: Build ───────────────────────────────────────────
  build:
    name: 🔨 Build
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📦 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 🔍 Install dependencies
        run: npm ci

      - name: 🔎 Lint (optional - won't fail build)
        run: npm run lint || true

      - name: 🏗️ Build production bundle
        run: npm run build
        env:
          NODE_ENV: production

      - name: 📊 Display build size
        run: |
          echo "=== Build Output ==="
          du -sh dist/
          echo "=== Files ==="
          find dist -type f | sort

      - name: 📤 Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-dist
          path: dist/
          retention-days: 7

  # ─── Job 2: Deploy to develop branch ───────────────────────
  deploy:
    name: 🚀 Deploy to develop
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 📥 Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: portfolio-dist
          path: dist/

      - name: 🌿 Deploy to develop branch
        run: |
          # Configure git
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Create or switch to develop branch
          git fetch origin develop || true
          git checkout develop 2>/dev/null || git checkout -b develop

          # Clear existing files (keep .git)
          find . -maxdepth 1 \
            ! -name '.git' \
            ! -name '.' \
            ! -name '..' \
            -exec rm -rf {} +

          # Copy built files to root
          cp -r dist/. .
          rm -rf dist/

          # Create a CNAME file if you have a custom domain
          # echo "your-domain.com" > CNAME

          # Add .nojekyll to avoid Jekyll processing
          touch .nojekyll

          # Commit and push
          git add -A
          git diff --staged --quiet || git commit -m "🚀 Deploy: $(date +'%Y-%m-%d %H:%M:%S') [$(git rev-parse --short HEAD main)]"
          git push origin develop --force

      - name: ✅ Deploy complete
        run: |
          echo "✅ Portfolio deployed to 'develop' branch!"
          echo "🌐 You can serve this branch with GitHub Pages or your hosting provider."

  # ─── Job 3: Notify (optional) ───────────────────────────────
  notify:
    name: 📣 Summary
    runs-on: ubuntu-latest
    needs: [build, deploy]
    if: always()

    steps:
      - name: 📝 Job summary
        run: |
          echo "## 🚀 Portfolio Deploy Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Step | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Build | ${{ needs.build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Deploy | ${{ needs.deploy.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Commit: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "Branch: \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
